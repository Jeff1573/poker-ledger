name: docker-publish

on:
  # main 分支用于持续发布测试镜像，v*.*.* 标签用于正式版本发布
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
  # 允许在 GitHub 页面手动触发
  workflow_dispatch:

# 同一 ref 仅保留最新一次发布任务，避免重复推送镜像
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: poker-ledger-server

jobs:
  test:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poker-ledger-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: poker-ledger-server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: node --test

  build_and_push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # 默认分支构建 main 标签，便于持续集成验证
            type=raw,value=main,enable={{is_default_branch}}
            # 每次构建保留基于 commit 的可追溯标签
            type=sha,prefix=sha-
            # 语义化标签触发时生成版本号标签（如 0.1.0 / 0.1）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 仅在 v*.*.* 标签发布时更新 latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./poker-ledger-server
          file: ./poker-ledger-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub overview
        # 仅在 main 与版本标签发布时更新镜像说明，避免分支内容误覆盖
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: 打牌记账小程序后端镜像（Node.js + WebSocket + SQLite）
          readme-filepath: ./poker-ledger-server/DOCKER_HUB_OVERVIEW.md
